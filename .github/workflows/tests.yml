name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests (includes real ping.exe tests against 127.0.0.1)
        run: python -m unittest discover -s tests -v
      - name: Smoke test - run the script once with the shipped config
        shell: cmd
        run: python auto_pinger.py --once
